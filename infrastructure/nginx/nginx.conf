upstream auth_service        { server auth-service:3001; }
upstream user_service        { server user-service:3002; }
upstream health_ingestion    { server health-ingestion:3003; }
upstream readiness_service   { server readiness-service:3004; }
upstream session_service     { server session-service:3006; }
upstream run_tracker         { server run-tracker:3007; }
upstream plan_service        { server plan-service:8001; }
upstream coach_service       { server coach-service:8002; }
upstream analytics_service   { server analytics-service:3009; }
upstream notification_service { server notification-service:3010; }

server {
    listen 80;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location /api/v1/auth/          { proxy_pass http://auth_service; }
    location /api/v1/users/         { proxy_pass http://user_service; }
    location /api/v1/health/        { proxy_pass http://health_ingestion; }
    location /api/v1/readiness/     { proxy_pass http://readiness_service; }
    location /api/v1/sessions/      { proxy_pass http://session_service; }
    location /api/v1/runs/          { proxy_pass http://run_tracker; }
    location /api/v1/plans/         { proxy_pass http://plan_service; }
    location /api/v1/coach/         { proxy_pass http://coach_service; }
    location /api/v1/analytics/     { proxy_pass http://analytics_service; }
    location /api/v1/notifications/ { proxy_pass http://notification_service; }

    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
